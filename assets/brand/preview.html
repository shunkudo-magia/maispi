<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まいすぴ ロゴ プレビュー</title>
<style>
  body { margin:0; font-family: -apple-system, "Hiragino Sans", sans-serif; color:#1a1825; background:#fafafa; }
  header { padding:32px 24px 8px; }
  h1 { font-size:20px; margin:0; color:#da668e; }
  p.sub { color:#6b6479; margin:4px 0 0; font-size:13px; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; padding:24px; }
  .tile { background:#fff; border:1px solid #e8e0e8; border-radius:16px; padding:24px;
          display:flex; flex-direction:column; align-items:center; gap:14px; min-width:200px; }
  .tile.dark { background:#1a1825; color:#fff; }
  .tile.pink { background:#fbe7ef; }
  .tile .cap { font-size:12px; color:#9b92a4; }
  .tile.dark .cap { color:#c9c2d0; }
  img, object { display:block; }
</style>
</head>
<body>
  <header>
    <h1>まいすぴ ロゴ</h1>
    <p class="sub">コンセプト「三日月とひらめきの光」</p>
  </header>
  <div class="grid">
    <div class="tile"><object data="logo-mark.svg" width="120" height="120"></object><span class="cap">logo-mark</span></div>
    <div class="tile"><object data="logo-horizontal.svg" width="280" height="83"></object><span class="cap">logo-horizontal</span></div>
    <div class="tile"><object data="logo-stacked.svg" width="180" height="208"></object><span class="cap">logo-stacked</span></div>
    <div class="tile"><object data="app-icon.svg" width="160" height="160" style="border-radius:36px;overflow:hidden"></object><span class="cap">app-icon</span></div>
    <div class="tile pink"><object data="adaptive-icon-foreground.svg" width="160" height="160"></object><span class="cap">adaptive-icon (on #fbe7ef)</span></div>
    <div class="tile dark"><object data="notification-icon.svg" width="80" height="80"></object><span class="cap">notification-icon</span></div>
    <div class="tile" style="color:#7b68ee"><object data="logo-mark-mono.svg" width="120" height="120"></object><span class="cap">logo-mark-mono (currentColor)</span></div>
  </div>
</body>
</html>
